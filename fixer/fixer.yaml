# The fixer's configuration (grant slice 3.4). `compose.py` reads it and binds
# the adapters it names; nothing else branches on which is bound.
apiVersion: agenttwin-lab-fixer/v0

# The main checkouts. The fixer never sees them: it works on git worktrees of
# them, on a branch per incident, under `workdir`. Relative to this file.
repos:
  reference-agent: ../../reference-agent
  clean-ai-engineering: ../../clean-ai-engineering
primary: reference-agent          # the fixer's working directory

# Beside the worktrees, so the relative paths the repos use to find each other
# resolve: reference-agent's `../agenttwin`, the gates' `../ai-harness-catalog`.
# Since 3.5 each is a detached worktree at the main checkout's HEAD, made
# read-only (`chmod -R a-w`), never a link to the main checkout.
siblings:
  agenttwin: ../../agenttwin
  ai-harness-catalog: ../../ai-harness-catalog
  ai-assurance-catalog: ../../ai-assurance-catalog

workdir: ../work                  # gitignored

# The executable is a port. `stub` replays a canned transcript and diff;
# `real-claude` runs Claude Code headless and needs ANTHROPIC_API_KEY in the
# environment (never in a file).
agent:
  adapter: stub
  stub: {fixture: honest}
  real-claude: {executable: claude, model: opus}

limits:
  max_turns: 40                   # per attempt (claude --max-turns)
  max_budget_usd: 5.0             # per attempt (claude --max-budget-usd)
  retries: 1                      # then the incident goes to a person

# What decides the fix is green. `incident-scenarios` runs the new scenario
# before and after the fix (seconds); `four-gates` adds clean-ai-engineering's
# tools/gates.py from the MAIN checkout, so the judge and the yardstick are
# never the fixer's copies (minutes).
gates:
  adapter: incident-scenarios
  four-gates: {script: ../../clean-ai-engineering/tools/gates.py}

# How the lab drives the fixed agent in a worktree: its gate binding, with the
# worktree's packages first on the lab interpreter's path.
drive:
  binding: evals.gate_binding:open_subject
  pythonpath: [src, packages/agent-harness/src]

# The day the fix is re-run against, with the incident's seed.
day:
  world: ../worlds/clothing-day.yaml
  plan: ../days/one-day.yaml

# Where the fixer writes the incident's scenario: in the agent's worktree,
# beside the yardstick and outside it (the gates read `scenarios/*.yaml`, not
# subdirectories). It joins the yardstick after a person reviews it (T-083).
incoming: reference-agent/scenarios/incoming

# Paths under the work directory the fixer may not change (T-083). Globs: `*`
# stays in one directory, `**` crosses them. Five layers defend them (3.5), each
# on its own and each logging to the fix run's `refusals.jsonl`:
#   permissions  Claude Code's deny rules for the file tools (and the main checkouts)
#   hooks        a PreToolUse hook reading shell commands for writes (a heuristic)
#   read_only    the siblings and the yardstick files chmod a-w during an attempt
#   runner       the runner diffs the result and reverts any protected change
#   pre_commit   a git pre-commit hook refusing a commit that stages one
# Server side, `.github/workflows/protected-paths.yml` fails a PR that changes
# one without the `protected-change-approved` label.
protected:
  - {path: "reference-agent/scenarios/*.yaml", why: "the yardstick scenarios and their expectations"}
  - {path: "reference-agent/worlds/**", why: "the worlds the yardstick runs in"}
  - {path: "reference-agent/gates.yaml", why: "how the gates reach the agent"}
  - {path: "reference-agent/harness-profile.yaml", why: "the accepted gaps the harness gate reads"}
  - {path: "reference-agent/evals/gate_binding.py", why: "the binding the gates drive the agent through"}
  - {path: "clean-ai-engineering/gates/**", why: "the yardstick and the feature inventory"}
  - {path: "clean-ai-engineering/tools/gates.py", why: "the gates themselves"}
  - {path: "agenttwin/**", why: "the world format and its oracles (AWD), linked from the main checkout"}
  - {path: "ai-assurance-catalog/**", why: "the assurance catalog (AAC), linked from the main checkout"}
  - {path: "ai-harness-catalog/**", why: "the harness catalog (AHC), linked from the main checkout"}
  - {path: "base/**", why: "the copies at the base the judge runs the new scenario on before the fix"}

# Paths the fixer may change, where a person approves before merge: a spec
# change is the owner's decision (T-083).
approval_required:
  - {path: "clean-ai-engineering/drafts/**", why: "the agent's spec (AOAS)"}
  - {path: "reference-agent/scenarios/incoming/**", why: "a new scenario joins the yardstick after review"}

# The defences, all on. A test turns one off to show the next catching it;
# `runner` is the guarantee (it reads the result, not the method). Claude
# Code's deny rules are always given, so they have no switch.
layers:
  read_only: true
  hooks: true
  runner: true
  pre_commit: true

# Shell commands the fixer may run, and ones it may not. Everything else is
# refused (permission mode dontAsk).
shell:
  allow: ["uv run:*", "git status:*", "git diff:*", "git log:*", "ls:*"]
  deny: ["git commit:*", "git push:*", "git checkout:*", "git reset:*", "git worktree:*",
         "git branch:*", "gh:*", "rm:*", "curl:*"]
